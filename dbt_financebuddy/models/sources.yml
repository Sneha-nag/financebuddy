version: 2

sources:
  - name: bronze
    description: Typed Parquet landing tables produced by the generator / ingest step.
    # Local DuckDB uses schema bronze; Athena tables live in database financebuddy
    schema: "{{ 'financebuddy' if target.name == 'athena' else 'bronze' }}"
    tables:
      - name: users
        columns:
          - name: user_id
            tests:
              - unique
              - not_null
      - name: transactions
        columns:
          - name: transaction_id
            tests:
              - unique
              - not_null
          - name: user_id
            tests:
              - not_null
          - name: amount
            tests:
              - not_null
      - name: merchants
        columns:
          - name: merchant_id
            tests:
              - unique
              - not_null